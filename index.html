      ${campo('Cadenza di visita o visita preliminare entro:', selN('oo-cad', CAD, o.cadenza || 0))}
      ${campo('Visite successive previste tra:', selN('oo-perc', PERC, o.visiteSuccessive ?? 0))}
      ${campo('Programmazione visite:', sel('oo-prog', [['Automatica', 'Automatica'], ['Manuale', 'Manuale'], ['Nessuna', 'Nessuna']], o.programmazione))}
      ${campo('Durata della visita:', `<div class="inline">${selN('oo-dur', DUR, o.durata || 30)} <span class="ic-blu" data-azione="oo-dur-tast" title="Inserisci i minuti">${ico('tastiera', 'ic-lc')}</span></div>`)}
      ${campo("Rispetto dell'orario di apertura:", sel('oo-risp', [['inizio', 'Inizio della visita'], ['intera', 'Intera visita'], ['nessuno', 'Nessuno']], o.rispettoApertura || 'inizio'))}
      <div class="sez">Predefinito per nuovi appuntamenti</div>
      ${campo('Margine di tempo:', selN('oo-marg', MARG, o.margineAppuntamento ?? 0))}
      <div class="sez">Agenda</div>
      ${campo('Attesa massima prima dell\'apertura:', `<div class="inline">${inp('oo-att', o.maxAttesa, 'number')} min</div>`)}
      <div class="centro" style="margin-top:8px"><a data-azione="oo-applica" style="cursor:pointer">Applica cadenza e durata a tutti i clienti…</a></div>`,
      pulsanti: [{ testo: 'Salva', cls: 'btn-pieno', azione: d => { o.cadenza = valNum(d, 'oo-cad') || 0; o.visiteSuccessive = valNum(d, 'oo-perc') || 0; o.durata = valNum(d, 'oo-dur') || 30; o.programmazione = val(d, 'oo-prog'); o.rispettoApertura = val(d, 'oo-risp'); o.margineAppuntamento = valNum(d, 'oo-marg') || 0; o.maxAttesa = valNum(d, 'oo-att') ?? 30; salvaDB(); } }, { testo: 'Annulla', cls: 'btn-grigio' }],
      onApri: d => { AZIONI['oo-dur-tast'] = () => { const m = prompt('Durata della visita in minuti:', val(d, 'oo-dur')); const n = Number(m); if (m != null && n > 0) { const s = $('#oo-dur', d); if (![...s.options].some(x => +x.value === n)) s.add(new Option(n + ' min', n)); s.value = n; } }; }
    });
    AZIONI['oo-applica'] = () => conferma('Applica a tutti', 'Sovrascrivere cadenza e durata di tutti i clienti con i valori indicati?', () => { const d = dialogStack[0]; const cad = valNum(d, 'oo-cad') || 0, dur = valNum(d, 'oo-dur') || 30; DB.clienti.forEach(c => { c.cadenza = cad; c.durata = dur; }); salvaDB(); invalidaCache(); toast('Applicato a ' + fmtNum(DB.clienti.length) + ' clienti'); });
  },
  'op-non-locale': () => avviso('Funzione del servizio online', `Questa voce esiste nel servizio online (invio email, sottoscrizioni a calendari esterni, account aziendale). ${APP_NOME} lavora in locale su questo dispositivo, quindi qui non è disponibile.`),
  'op-config-import': () => { const c = DB.settings.configImport || []; apriDialog({ titolo: 'Configurazioni di importazione', corpo: c.length ? `<div class="lista-campi">${c.map((x, i) => `<div class="lc"><span class="n">${esc(x.nome)} <span class="testo-piccolo">${fmtData(x.data)} · ${Object.keys(x.mappa || {}).length} colonne</span></span><span data-azione="ci-elimina" data-i="${i}">${ico('cestino')}</span></div>`).join('')}</div>` : `<div>Nessuna configurazione salvata. Le mappature delle colonne vengono salvate automaticamente al termine di ogni importazione (Opzioni → Importa dati) e riproposte quando importi di nuovo un file con le stesse intestazioni.</div>`, pulsanti: [{ testo: 'Chiudi', cls: 'btn-grigio' }] }); },
  'ci-elimina': el => { DB.settings.configImport.splice(+el.dataset.i, 1); salvaDB(); chiudiTuttiDialog(); AZIONI['op-config-import'](); },
  'op-apertura': () => apriDialog({ titolo: 'Orario di apertura predefinito', aiuto: 'Vale per i clienti senza orario proprio.', corpo: corpoOrario('oap', DB.settings.aperturaDefault), pulsanti: [{ testo: 'Salva', cls: 'btn-pieno', azione: d => { DB.settings.aperturaDefault = leggiOrario(d, 'oap') || dbDefault().settings.aperturaDefault; salvaDB(); } }, { testo: 'Annulla', cls: 'btn-grigio' }] }),
  'op-rapporti': () => apriDialog({ titolo: 'Gestione dei rapporti', corpo: `${campo('Oggetti:', `<textarea id="gr-ogg">${esc(DB.settings.oggettiRapporto.join('\n'))}</textarea>`)}<div class="testo-piccolo">Un oggetto per riga. "Non disponibile" è speciale: registra solo il tentativo di visita. Per aggiungere campi ai rapporti (es. "Ha ordinato?") usa Campi personalizzati.</div>`, pulsanti: [{ testo: 'Salva', cls: 'btn-pieno', azione: d => { const l = val(d, 'gr-ogg').split('\n').map(x => x.trim()).filter(Boolean); if (!l.includes('Non disponibile')) l.push('Non disponibile'); DB.settings.oggettiRapporto = l; salvaDB(); } }, { testo: 'Annulla', cls: 'btn-grigio' }] }),
  'op-condivisione': () => apriDialog({ titolo: 'Condivisione calendario', corpo: `<div>Esporta appuntamenti (e, se vuoi, le visite pianificate) in un file <b>.ics</b> da importare in Outlook, Google Calendar o Apple Calendario.</div><label class="checkbox-riga" style="margin-top:8px"><input type="checkbox" id="cc-agenda" checked> Includi le visite dell'agenda</label>`, pulsanti: [{ testo: 'Scarica .ics', cls: 'btn-pieno', azione: d => scaricaFile('clientour-calendario.ics', generaICS(val(d, 'cc-agenda')), 'text/calendar') }, { testo: 'Annulla', cls: 'btn-grigio' }] }),
  'op-alloggi': () => {
    const ren = () => `<div class="lista-campi">${DB.alloggi.map(a => `<div class="lc"><span class="n">${esc(a.nome)} <span class="testo-piccolo">${esc(a.citta || '')}${a.lat == null ? ' · <span class="urg-rosso">non geocodificato</span>' : ''}</span></span><span data-azione="al-elimina" data-id="${a.id}">${ico('cestino')}</span></div>`).join('') || '<div class="centro">Nessun alloggio. Puoi anche segnare un cliente come "Alloggio preferito" nella sua scheda.</div>'}</div>`;
    apriDialog({ titolo: 'Alloggi preferiti', corpo: `<div id="al-lista">${ren()}</div>`, pulsanti: [{ testo: 'Nuovo alloggio', cls: 'btn-contorno', nonChiudere: true, azione: () => apriDialog({ titolo: 'Nuovo alloggio', corpo: `${campo('Nome:', inp('na-nome', ''))}${campo('Via:', inp('na-via', ''))}${campo('CAP:', inp('na-cap', ''))}${campo('Città:', inp('na-citta', ''))}${campo('Provincia:', inp('na-prov', ''))}<div class="inline">${campo('Lat:', inp('na-lat', '', 'text', 'style="width:100px"'))}${campo('Lng:', inp('na-lng', '', 'text', 'style="width:100px"'))}</div><div class="centro"><button class="btn-contorno" id="na-geo">Geocodifica</button> <span id="na-msg" class="testo-piccolo"></span></div>`, pulsanti: [{ testo: 'Salva', cls: 'btn-pieno', azione: d => { if (!val(d, 'na-nome')) return false; DB.alloggi.push({ id: uid(), nome: val(d, 'na-nome'), via: val(d, 'na-via'), cap: val(d, 'na-cap'), citta: val(d, 'na-citta'), provincia: val(d, 'na-prov'), lat: valNum(d, 'na-lat'), lng: valNum(d, 'na-lng') }); salvaDB(); $('#al-lista').innerHTML = ren(); } }, { testo: 'Annulla', cls: 'btn-grigio' }], onApri: d => { $('#na-geo', d).onclick = async () => { const m = $('#na-msg', d); m.textContent = 'ricerca...'; try { const g = await geocodifica({ via: val(d, 'na-via'), cap: val(d, 'na-cap'), citta: val(d, 'na-citta'), provincia: val(d, 'na-prov') }); if (g) { $('#na-lat', d).value = g.lat.toFixed(6); $('#na-lng', d).value = g.lng.toFixed(6); m.textContent = 'trovato'; } else m.textContent = 'non trovato'; } catch (e) { m.textContent = 'offline'; } }; } }) }, { testo: 'Chiudi', cls: 'btn-grigio' }] });
    AZIONI['al-elimina'] = el => { DB.alloggi = DB.alloggi.filter(a => a.id !== el.dataset.id); salvaDB(); $('#al-lista').innerHTML = ren(); };
  },
  'op-campi': () => apriDialog({ titolo: 'Campi personalizzati', corpo: `<div class="lista-campi">${[['clienti', 'Clienti'], ['appuntamenti', 'Appuntamenti'], ['compiti', 'Compiti'], ['rapporti', 'Rapporti']].map(([k, t]) => `<div class="lc" data-azione="op-campi-tipo" data-t="${k}" style="cursor:pointer"><span class="n" style="color:var(--blu2)">${t}</span></div>`).join('')}</div>`, pulsanti: [] }),
  'op-campi-tipo': el => { chiudiTuttiDialog(); dialogCampiPersonalizzati(el.dataset.t); },
  'op-relazione-imp': () => avviso('Impostazioni della relazione', 'La relazione statistica si calcola sui dati locali (vedi Rapporti → Richiedi Relazione). Nella versione locale non ci sono invii periodici via email.'),
  'op-importa': () => mostraVista('importa'),
  'op-esporta': () => apriDialog({ titolo: 'Esporta dati', corpo: `<div class="lista-campi"><div class="lc"><span class="n" style="cursor:pointer;color:var(--blu2)" data-azione="ex-json">Backup completo (JSON) — tutti i dati, per ripristino o per spostarli su un altro dispositivo</span></div><div class="lc"><span class="n" style="cursor:pointer;color:var(--blu2)" data-azione="ex-clienti">Clienti (CSV per Excel)</span></div><div class="lc"><span class="n" style="cursor:pointer;color:var(--blu2)" data-azione="rp-esporta">Rapporti (CSV)</span></div><div class="lc"><span class="n" style="cursor:pointer;color:var(--blu2)" data-azione="co-esporta">Compiti (CSV)</span></div><div class="lc"><span class="n" style="cursor:pointer;color:var(--blu2)" data-azione="ag-esporta">Agenda (CSV)</span></div></div>` }),
  'ex-json': () => { scaricaFile('clientour-backup-' + oggiIso() + '.json', JSON.stringify(DB, null, 1), 'application/json'); toast('Backup scaricato'); },
  'ex-clienti': () => { const campi = DB.settings.campi.clienti; const int = ['Nome', 'Via', 'CAP', 'Città', 'Provincia', 'Paese', 'Latitudine', 'Longitudine', 'Categorie', 'Tipo', 'Numero cliente', 'Contatto', 'Telefono', 'Cellulare', 'Email', 'CRM', 'Nota', 'Fatturato', 'Cadenza di visita', 'Durata della visita', 'Pianificazione', 'Visita precedente', 'Precedente tentativo', 'Promemoria', 'Simbolo', ...campi.map(f => f.nome)]; const righe = DB.clienti.map(c => csvRiga([c.nome, c.via, c.cap, c.citta, c.provincia, c.paese, c.lat, c.lng, c.categoria, c.tipo, c.numeroCliente, c.contatto, c.telefono, c.cellulare, c.email, c.crm, c.nota, c.fatturato, c.cadenza, c.durata, c.programmazione, c.visitaPrecedente ? c.visitaPrecedente.replace('T', ' ') : '', c.precedenteTentativo ? c.precedenteTentativo.replace('T', ' ') : '', c.promemoria, c.simbolo, ...campi.map(f => formattaCustom(f, c.custom[f.id]))])); scaricaFile('clienti.csv', '﻿' + [csvRiga(int), ...righe].join('\n'), 'text/csv'); toast('Clienti esportati (CSV)'); },

function dialogCampiPersonalizzati(tipo) {
  const TIT = { clienti: 'Clienti', rapporti: 'Rapporti', appuntamenti: 'Appuntamenti', compiti: 'Compiti' };
  const gruppi = DB.settings.gruppi[tipo]; const campi = DB.settings.campi[tipo];
  const ren = () => gruppi.map((g, gi) => `<div class="lc gruppo-riga"><span class="n gr">${esc(g.nome)}</span><span data-azione="cp-g-modifica" data-g="${g.id}">${ico('matita')}</span><span data-azione="cp-g-giu" data-i="${gi}">${ico('giu')}</span><span data-azione="cp-g-su" data-i="${gi}">${ico('su')}</span><span data-azione="cp-g-elimina" data-g="${g.id}">${ico('cestino')}</span></div>${campi.filter(f => f.gruppo === g.id).map(f => { const i = campi.indexOf(f); return `<div class="lc"><span class="n">${esc(f.nome)}<span class="tipo-campo">${esc(f.tipo)}${f.mostraNome ? ' · nel nome' : ''}${f.modalita === 'Sola lettura' ? ' · sola lettura' : f.modalita === 'Nascondi' ? ' · nascosto' : ''}</span></span><span data-azione="cp-modifica" data-i="${i}">${ico('matita')}</span><span data-azione="cp-giu" data-i="${i}">${ico('giu')}</span><span data-azione="cp-su" data-i="${i}">${ico('su')}</span><span data-azione="cp-elimina" data-i="${i}">${ico('cestino')}</span></div>`; }).join('')}<div class="centro" style="padding:6px"><button class="btn-contorno" data-azione="cp-nuovo" data-g="${g.id}">Nuovo campo</button></div>`).join('') + `<div class="centro" style="padding:10px"><button class="btn-contorno" data-azione="cp-g-nuovo">Nuovo gruppo</button></div>`;
  apriDialog({ titolo: 'Campi personalizzati — ' + TIT[tipo], aiuto: 'I campi sono organizzati in gruppi: ogni gruppo è una scheda nella pagina del cliente. Fino a 100 campi per tipo.', corpo: `<div class="lista-campi" id="cp-lista">${ren()}</div>`, pulsanti: [{ testo: 'Chiudi', cls: 'btn-grigio', azione: () => rinfresca() }] });
  const agg = () => { $('#cp-lista').innerHTML = ren(); salvaDB(); };
  const modificaCampo = (gid, f) => {
    const nuovo = !f; const x = f || { id: uid(), nome: '', tipo: 'Testo', modalita: 'Scrittura', mostraNome: false, descrizione: '', opzioni: [], gruppo: gid };
    apriDialog({ titolo: nuovo ? 'Nuovo campo' : 'Modifica campo', corpo: `${campo('Nome campo:', inp('cp-nome', x.nome))}${campo('Tipo di dati:', sel('cp-tipo', TIPI_CAMPO, x.tipo === 'Testo lungo' ? 'Testo di più righe' : x.tipo === 'Sì/No' ? 'Sì / No' : x.tipo))}${campo('Opzioni (una per riga):', `<textarea id="cp-opz" placeholder="solo per Selezione / Selezione multipla">${esc((x.opzioni || []).map(o => typeof o === 'object' ? (o.v ?? o.Value) : o).join('\n'))}</textarea>`)}${campo('Modalità:', sel('cp-mod', MODALITA_CAMPO, x.modalita))}${tipo === 'clienti' ? campo('Mostra nel nome del cliente:', sel('cp-mostra', [['false', 'No'], ['true', 'Sì']], String(!!x.mostraNome))) : ''}${campo('Gruppo:', sel('cp-gruppo', gruppi.map(g => [g.id, g.nome]), x.gruppo))}${campo('Descrizione (facoltativa):', `<textarea id="cp-desc">${esc(x.descrizione || '')}</textarea>`)}`, pulsanti: [{ testo: 'Salva', cls: 'btn-pieno', azione: d => { x.nome = val(d, 'cp-nome'); if (!x.nome) { toast('Nome obbligatorio'); return false; } x.tipo = val(d, 'cp-tipo'); x.modalita = val(d, 'cp-mod'); x.mostraNome = val(d, 'cp-mostra') === 'true'; x.gruppo = val(d, 'cp-gruppo'); x.opzioni = val(d, 'cp-opz').split('\n').map(s => s.trim()).filter(Boolean); x.descrizione = val(d, 'cp-desc'); if (nuovo) { if (campi.length >= 100) { toast('Massimo 100 campi'); return false; } campi.push(x); } agg(); } }, { testo: 'Annulla', cls: 'btn-grigio' }] });
  };
  const modificaGruppo = g => {
    const nuovo = !g; const x = g || { id: uid(), nome: '', etichette: 0 };
    apriDialog({ titolo: nuovo ? 'Nuovo gruppo' : 'Modifica gruppo', corpo: `${campo('Nome gruppo:', inp('cg-nome', x.nome))}${campo('Posizione etichette:', sel('cg-et', ETICHETTE_GRUPPO.map((t, i) => [i, t]), x.etichette || 0))}`, pulsanti: [{ testo: 'Salva', cls: 'btn-pieno', azione: d => { x.nome = val(d, 'cg-nome'); if (!x.nome) return false; x.etichette = +val(d, 'cg-et'); if (nuovo) gruppi.push(x); agg(); } }, { testo: 'Annulla', cls: 'btn-grigio' }] });
  };
  const sposta = (arr, i, dir, stessoGruppo) => { let j = i + dir; if (stessoGruppo) { while (j >= 0 && j < arr.length && arr[j].gruppo !== arr[i].gruppo) j += dir; } if (j < 0 || j >= arr.length) return; const [x] = arr.splice(i, 1); arr.splice(j, 0, x); agg(); };
  Object.assign(AZIONI, {
    'cp-nuovo': el => modificaCampo(el.dataset.g, null),
    'cp-modifica': el => modificaCampo(null, campi[+el.dataset.i]),
    'cp-elimina': el => { const f = campi[+el.dataset.i]; conferma('Elimina campo', `Eliminare il campo <b>${esc(f.nome)}</b> e i suoi valori?`, () => { campi.splice(+el.dataset.i, 1); agg(); }, 'Elimina'); },
    'cp-su': el => sposta(campi, +el.dataset.i, -1, true),
    'cp-giu': el => sposta(campi, +el.dataset.i, 1, true),
    'cp-g-nuovo': () => modificaGruppo(null),
    'cp-g-modifica': el => modificaGruppo(gruppi.find(g => g.id === el.dataset.g)),
    'cp-g-elimina': el => { const g = gruppi.find(x => x.id === el.dataset.g); const n = campi.filter(f => f.gruppo === g.id).length; conferma('Elimina gruppo', `Eliminare il gruppo <b>${esc(g.nome)}</b>${n ? ` con i suoi ${n} campi e i relativi valori` : ''}?`, () => { DB.settings.campi[tipo] = campi.filter(f => f.gruppo !== g.id); gruppi.splice(gruppi.indexOf(g), 1); chiudiTuttiDialog(); dialogCampiPersonalizzati(tipo); salvaDB(); }, 'Elimina'); },
    'cp-g-su': el => sposta(gruppi, +el.dataset.i, -1, false),
    'cp-g-giu': el => sposta(gruppi, +el.dataset.i, 1, false)
  });
}

/* ====================================================================
   SINCRONIZZAZIONE CLOUD (local-first)
   - l'archivio locale (IndexedDB) resta la fonte primaria: velocità invariata, offline sempre
   - ogni record (cliente, rapporto, appuntamento, compito, alloggio, cestino) porta _m = ultima modifica (ms)
   - le impostazioni, l'agenda e gli inserimenti sono "singoli" (un record ciascuno)
   - sul cloud: base-<ts>-<dispositivo>.json(.gz) = fotografia completa; d-<ts>-<dispositivo>.json(.gz) = solo i record cambiati (delta)
   - unione: vince la modifica più recente (_m); le cancellazioni viaggiano come lapidi {id,_m}

function syncStato(s, msg) { SYNC.stato = s; SYNC.messaggio = msg || ''; const el = $('#sync-stato'); if (el) { el.className = 'sync-' + s; el.title = ({ off: 'Sincronizzazione non attiva', ok: 'Sincronizzato' + (SYNC.meta && SYNC.meta.ultimoSync ? ' alle ' + new Date(SYNC.meta.ultimoSync).toLocaleTimeString('it-IT').slice(0, 5) : ''), sync: 'Sincronizzazione in corso…', errore: 'Errore: ' + msg, offline: 'Offline: le modifiche verranno inviate al ritorno della connessione', auth: 'Serve l\'autorizzazione: clicca per riconnettere' })[s] || s; } }

/* ---- fotografia dello stato locale e differenze rispetto all'ultima sincronizzazione ---- */
function syncRecordLocali() {
  const out = {};

  SYNC_SINGOLI.forEach(s => { out[s] = {}; out[s][s] = DB[s]; });
  return out;
}
function syncSnapshotHash(loc) { const h = {}; Object.keys(loc).forEach(c => { h[c] = {}; Object.keys(loc[c]).forEach(id => { h[c][id] = syncHash(syncNorm(loc[c][id])); }); }); return h; }

/* ---- compressione (gzip se disponibile) ---- */
async function syncComprimi(testo) {
  if (typeof CompressionStream === 'undefined') return { dati: new TextEncoder().encode(testo), gz: false };
  const cs = new CompressionStream('gzip'); const w = cs.writable.getWriter(); w.write(new TextEncoder().encode(testo)); w.close();
  return { dati: new Uint8Array(await new Response(cs.readable).arrayBuffer()), gz: true };
}
async function syncDecomprimi(buf, gz) {

function syncNomeInfo(nome) { const m = nome.match(/^(base|d)-(\d+)-([a-z0-9]+)\.json(\.gz)?$/i); return m ? { tipo: m[1], ts: +m[2], dev: m[3], gz: !!m[4] } : null; }

      else { const { dati: buf, gz } = await syncComprimi(JSON.stringify({ v: 1, ts, dev: me, mod: diff.mod, del: diff.del })); await be.scrivi(`d-${ts}-${me}.json${gz ? '.gz' : ''}`, buf); syncLog(`inviati ${diff.n} record`); }

    } else if (!base && !lista.length) { const loc = syncRecordLocali(); const dati = {}; Object.keys(loc).forEach(c => { dati[c] = Object.values(loc[c]); }); const ts = Date.now(); const { dati: buf, gz } = await syncComprimi(JSON.stringify({ v: 1, ts, dev: me, dati, tomb: syncTombLista() })); await be.scrivi(`base-${ts}-${me}.json${gz ? '.gz' : ''}`, buf); SYNC.meta.baseTs = ts; SYNC.meta.ultimoTs = Math.max(SYNC.meta.ultimoTs || 0, ts); syncLog('prima fotografia inviata'); }
    // 4. compattazione: nuova fotografia e pulizia dei delta vecchi
    const nDelta = lista.filter(f => f.tipo === 'd').length + (diff.n ? 1 : 0);
    if (compatta || nDelta > 40 || basi.length > 1) {
      const ts = Math.max(Date.now(), (SYNC.meta.ultimoTs || 0) + 1); const loc = syncRecordLocali(); const dati = {}; Object.keys(loc).forEach(c => { dati[c] = Object.values(loc[c]); });
      const { dati: buf, gz } = await syncComprimi(JSON.stringify({ v: 1, ts, dev: me, dati, tomb: syncTombLista() })); await be.scrivi(`base-${ts}-${me}.json${gz ? '.gz' : ''}`, buf);
      SYNC.meta.baseTs = ts; SYNC.meta.ultimoTs = Math.max(SYNC.meta.ultimoTs || 0, ts);
      lista = (await be.lista()).map(f => Object.assign(f, syncNomeInfo(f.nome) || {})).filter(f => f.tipo);
      for (const f of lista) if (f.ts < ts && be.elimina) { try { await be.elimina(f); } catch (e) { } }

    else if (diff.n) { SYNC.sospendi = true; salvaDB(true); SYNC.sospendi = false; }

}
function syncPianifica(ms = 4000) { if (!SYNC.meta || !SYNC.meta.tipo || SYNC.sospendi) return; clearTimeout(SYNC.pianTimer); SYNC.pianTimer = setTimeout(() => sincronizza(), ms); }

window.addEventListener('online', () => syncPianifica(500));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncPianifica(500); });
// aggancio al salvataggio: ogni salvaDB programma una sincronizzazione
{ const _salvaDB = salvaDB; salvaDB = function (subito) { _salvaDB(subito); syncPianifica(); }; }

/* ---- interfaccia ---- */
function dialogSincronizzazione() {
  const m = SYNC.meta; const fileOk = 'showDirectoryPicker' in window; const httpsOk = location.protocol === 'https:' || location.hostname === 'localhost';
  const stato = () => `<div class="kv"><div class="k">Stato:</div><div class="v">${({ off: 'non attiva', ok: 'sincronizzato', sync: 'in corso…', errore: 'errore', offline: 'offline', auth: 'autorizzazione necessaria' })[SYNC.stato]}${SYNC.messaggio ? ' — ' + esc(SYNC.messaggio) : ''}</div><div class="k">Ultimo allineamento:</div><div class="v">${m.ultimoSync ? new Date(m.ultimoSync).toLocaleString('it-IT') : '-'}</div><div class="k">Questo dispositivo:</div><div class="v">${m.dispositivo}</div><div class="k">Conflitti risolti:</div><div class="v">${m.conflitti || 0}</div></div><div class="testo-piccolo" style="margin-top:6px;white-space:pre-line">${esc(SYNC.ultimoLog.slice(0, 6).join('\n'))}</div>`;
  apriDialog({
    titolo: 'Sincronizzazione cloud', larga: true, aiuto: 'L\'app continua a lavorare sull\'archivio locale (stessa velocità, anche offline) e in sottofondo allinea solo i record cambiati con il cloud scelto. Su più dispositivi vince la modifica più recente.',
    corpo: `<div class="sez">Dove sincronizzare</div>${campo('Servizio:', sel('sy-tipo', [['', 'Nessuno (solo questo dispositivo)'], ['drive', 'Google Drive (tutti i dispositivi)'], ['cartella', 'Cartella sul computer: iCloud Drive / Google Drive per desktop' + (fileOk ? '' : ' — non supportata da questo browser')], ['server', 'Server personale (HTTP)']], m.tipo || ''))}
    <div id="sy-drive" style="display:${m.tipo === 'drive' ? 'block' : 'none'}">${campo('Client ID OAuth di Google:', inp('sy-client', m.clientId || '', 'text', 'placeholder="xxxxxxxx.apps.googleusercontent.com" style="width:100%"'))}${httpsOk ? '' : '<div class="urg-rosso testo-piccolo">Google Drive richiede che l\'app sia aperta da un indirizzo https (non da un file locale).</div>'}<div class="testo-piccolo">I dati vengono salvati nello spazio riservato all\'app nel tuo Google Drive (non visibile tra i file normali). Il Client ID si crea una volta sola su console.cloud.google.com → Credenziali → ID client OAuth → Applicazione web, con l\'indirizzo dell\'app tra le origini autorizzate.</div><div class="centro" style="margin-top:6px"><button class="btn-contorno" data-azione="sy-connetti-drive">Connetti a Google</button></div></div>
    <div id="sy-cartella" style="display:${m.tipo === 'cartella' ? 'block' : 'none'}"><div class="kv"><div class="k">Cartella:</div><div class="v" id="sy-dir-nome">${SYNC.dirHandle ? esc(SYNC.dirHandle.name) : 'nessuna'}</div></div><div class="centro" style="margin-top:6px"><button class="btn-contorno" data-azione="sy-scegli-cartella">Scegli cartella…</button></div><div class="testo-piccolo">Scegli una cartella dentro iCloud Drive o Google Drive sul computer: i file di sincronizzazione (base-… e d-…) vengono tenuti allineati dal client cloud. Funziona in Chrome ed Edge su Mac e Windows.</div></div>
    <div id="sy-server" style="display:${m.tipo === 'server' ? 'block' : 'none'}">${campo('Indirizzo del server:', inp('sy-url', m.serverUrl || '', 'text', 'placeholder="https://mio-server:8787" style="width:100%"'))}<div class="testo-piccolo">Server HTTP semplice (GET /lista, GET/PUT/DELETE /f/nome): ad esempio sul Mac mini.</div></div>
    <div class="sez">Stato</div><div id="sy-stato">${stato()}</div>`,
    pulsanti: [{ testo: 'Salva', cls: 'btn-pieno', azione: d => { m.tipo = val(d, 'sy-tipo') || null; m.clientId = val(d, 'sy-client').trim(); m.serverUrl = val(d, 'sy-url').trim(); syncSalvaMeta().then(() => syncAvvia()); } }, { testo: 'Sincronizza ora', cls: 'btn-contorno', nonChiudere: true, azione: d => { m.tipo = val(d, 'sy-tipo') || null; m.clientId = val(d, 'sy-client').trim(); m.serverUrl = val(d, 'sy-url').trim(); syncSalvaMeta(); sincronizza({ interattivo: true }).then(() => { const s = $('#sy-stato', d); if (s) s.innerHTML = stato(); }); } }, { testo: 'Compatta', cls: 'btn-contorno', nonChiudere: true, azione: d => sincronizza({ interattivo: true, compatta: true }).then(() => { const s = $('#sy-stato', d); if (s) s.innerHTML = stato(); }) }, { testo: 'Scollega', cls: 'btn-grigio', azione: () => { Object.assign(m, { tipo: null, ultimoTs: 0, baseTs: 0, hash: {}, tomb: {} }); SYNC.dirHandle = null; idbSet('syncDir', null); syncSalvaMeta(); syncAvvia(); toast('Sincronizzazione disattivata'); } }, { testo: 'Chiudi', cls: 'btn-grigio' }],
    onApri: d => { $('#sy-tipo', d).onchange = () => { const t = $('#sy-tipo', d).value; $('#sy-drive', d).style.display = t === 'drive' ? 'block' : 'none'; $('#sy-cartella', d).style.display = t === 'cartella' ? 'block' : 'none'; $('#sy-server', d).style.display = t === 'server' ? 'block' : 'none'; }; }
  });
}
Object.assign(AZIONI, {
  'op-sync': () => dialogSincronizzazione(),
  'sy-connetti-drive': async () => { const d = dialogStack[dialogStack.length - 1]; SYNC.meta.clientId = val(d, 'sy-client').trim(); SYNC.meta.tipo = 'drive'; await syncSalvaMeta(); try { await SYNC_DRIVE.token(true); toast('Google connesso'); syncAvvia(); } catch (e) { toast('Google: ' + (e.message || e), 4000); } },
  'sy-scegli-cartella': async () => { try { const h = await window.showDirectoryPicker({ mode: 'readwrite' }); SYNC.dirHandle = h; await idbSet('syncDir', h); const d = dialogStack[dialogStack.length - 1]; const n = $('#sy-dir-nome', d); if (n) n.textContent = h.name; $('#sy-tipo', d).value = 'cartella'; SYNC.meta.tipo = 'cartella'; await syncSalvaMeta(); toast('Cartella scelta: ' + h.name); } catch (e) { if (e.name !== 'AbortError') toast('Cartella: ' + (e.message || e)); } },
